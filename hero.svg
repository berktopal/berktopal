<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" /><stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <clipPath id="terminal-clip">
      <rect x="0" y="0" width="400" height="530" rx="16" />
    </clipPath>
  </defs>

  <rect width="1180" height="610" rx="24" fill="url(#bg)" />

  <g opacity="0.3">
    <circle cx="100" cy="500" r="40" fill="#7C3AED" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,-100; 0,0" dur="15s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="100" r="60" fill="#22D3EE" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -50,50; 0,0" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="300" r="80" fill="#10B981" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 30,40; 0,0" dur="18s" repeatCount="indefinite" />
    </circle>
  </g>

  <g transform="translate(40, 40)">
    <rect width="400" height="530" rx="16" fill="#0F172A" stroke="rgba(255,255,255,0.08)" stroke-width="1" filter="url(#glass)" />
    
    <!-- Top Bar Dots -->
    <circle cx="25" cy="25" r="6" fill="#EF4444" opacity="0.8" />
    <circle cx="45" cy="25" r="6" fill="#F59E0B" opacity="0.8" />
    <circle cx="65" cy="25" r="6" fill="#10B981" opacity="0.8" />
    
    <!-- Animated Scanline -->
    <rect x="30" width="340" height="4" fill="rgba(34,211,238,0.2)">
      <animate attributeName="y" values="0; 530; 0" dur="4s" repeatCount="indefinite" />
    </rect>
    
    <!-- ASCII ART BLOCK -->
    <g clip-path="url(#terminal-clip)">
        <g transform="translate(40, 75)" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1.5" fill="url(#accent)" filter="url(#glow)">
      <text y="0" xml:space="preserve">                                        </text>
      <text y="11" xml:space="preserve">                                        </text>
      <text y="22" xml:space="preserve">               ::,::+*+:**:             </text>
      <text y="33" xml:space="preserve">            :&amp;M@@@@MMM@@@#M8,.          </text>
      <text y="44" xml:space="preserve">        :+?&amp;@@@@@@@@@@@@@@@@@@#*        </text>
      <text y="55" xml:space="preserve">     .?8M@@@@@@@@@@@@@@@@@@@@@@@8?.     </text>
      <text y="66" xml:space="preserve">     *M@@@@@@@@@@@@@@@@@@@@@@@@@@@&amp;?    </text>
      <text y="77" xml:space="preserve">  .%#M@@@@@@@@@@@@@@@@@@@@@@@@@@@@@M?.  </text>
      <text y="88" xml:space="preserve">  +@@@@@@@@@@@MM@@@@@@@@@@@@@@@@@@@@@M* </text>
      <text y="99" xml:space="preserve">.*@M@@@@@@@@M#MM###MM##MM@@M@@@@@@@@@@@:</text>
      <text y="110" xml:space="preserve">:@@@@@@@@@M8#8&amp;?+?8M##88##MMMM@@@@@@@@@?</text>
      <text y="121" xml:space="preserve">,8@@@@@@@@&amp;*%%*::*88&amp;%??*?&amp;##8M@@@@@@@@%</text>
      <text y="132" xml:space="preserve">,M@@@@@@M%+,,,...,,+*:,,.,:?%&amp;&amp;@@@@@@@@?</text>
      <text y="143" xml:space="preserve">,@@@@@@@&amp;*?%?++:,,.  ..,,:+?%??#@@@@@@@8</text>
      <text y="154" xml:space="preserve"> ,@@@@@@?&amp;8888###8+..:&amp;#M##88#&amp;%@@@@@@8 </text>
      <text y="165" xml:space="preserve">  *M#@@M+**???&amp;%?%*,.*&amp;&amp;%&amp;%%???*&amp;@@@@#+ </text>
      <text y="176" xml:space="preserve">   +%&amp;M8:+?8&amp;%#?*?*,,*??*#&amp;&amp;#%*+?M&amp;#?   </text>
      <text y="187" xml:space="preserve">    :??%:::+*++**++,,+***++**+++*%+8,   </text>
      <text y="198" xml:space="preserve">     :**+:,..,,,,:+,.++:,:,,,,:++?+:    </text>
      <text y="209" xml:space="preserve">     .+:+:,.....,++. ,*+,,,..,:+++*     </text>
      <text y="220" xml:space="preserve">      :*+:,,...,:*&amp;+:?%+:,,.,::++:,     </text>
      <text y="231" xml:space="preserve">       ..+:,,..,:*%*?%?:,,,,::+:        </text>
      <text y="242" xml:space="preserve">         :+:::+%&amp;8&amp;+*88&amp;%*:::+*.        </text>
      <text y="253" xml:space="preserve">          ++++&amp;8&amp;%?**?%&amp;&amp;&amp;+++*:         </text>
      <text y="264" xml:space="preserve">          :*++*++*?%%?*++*****,         </text>
          <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite" />
        </g>
    </g>

    <!-- Console Output -->
    <rect x="35" y="480" width="10" height="15" fill="#22D3EE">
      <animate attributeName="opacity" values="1; 0; 1" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="55" y="492" font-family="monospace" font-size="14" fill="#94A3B8">> System.out.println("Ready to build.");</text>
  </g>

  <!-- Right Side: Info -->
  <g transform="translate(480, 40)">
    <text x="0" y="40" font-family="sans-serif" font-weight="bold" font-size="42" fill="#F8FAFC">Hi 👋 I'm Berk Topal</text>
    
    <g transform="translate(0, 90)" font-family="monospace" font-size="24" fill="url(#accent)">
      <text x="0" y="0" opacity="0">Software Engineer
        <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.33; 0.38; 1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="0" y="0" opacity="0">Full-Stack Developer
        <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.33; 0.38; 0.66; 1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="0" y="0" opacity="0">New Graduate
        <animate attributeName="opacity" values="0; 0; 0; 1; 1" keyTimes="0; 0.66; 0.71; 0.95; 1" dur="9s" repeatCount="indefinite" />
      </text>
    </g>

    <g transform="translate(0, 150)" font-family="sans-serif" font-size="16">
      <text x="0" y="0" fill="#94A3B8" font-weight="600">Location:</text>
      <text x="140" y="0" fill="#F8FAFC">Denizli, Türkiye</text>
      
      <text x="0" y="35" fill="#94A3B8" font-weight="600">Education:</text>
      <text x="140" y="35" fill="#F8FAFC">Bahçeşehir University (Software Engineering)</text>
      
      <text x="0" y="70" fill="#94A3B8" font-weight="600">Current Focus:</text>
      <text x="140" y="70" fill="#F8FAFC">Backend Architecture &amp; Financial Tech</text>
      
      <text x="0" y="105" fill="#94A3B8" font-weight="600">Projects:</text>
      <text x="140" y="105" fill="#F8FAFC">SyllabusAI (Capstone) | Berq Bank (P2P)</text>
      
      <text x="0" y="140" fill="#94A3B8" font-weight="600">Hobbies:</text>
      <text x="140" y="140" fill="#F8FAFC">Fitness, Running, American Football</text>
    </g>

    <g transform="translate(0, 340)">
      <text x="0" y="-20" font-family="sans-serif" font-weight="bold" font-size="20" fill="#F8FAFC">Tech Stack</text>
      
      <g transform="translate(0, 0)">
        <rect width="80" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #7C3AED; rgba(255,255,255,0.1)" dur="4s" repeatCount="indefinite" />
        </rect>
        <text x="40" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">Java</text>
      </g>
      <g transform="translate(95, 0)">
        <rect width="115" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #10B981; rgba(255,255,255,0.1)" dur="5s" repeatCount="indefinite" />
        </rect>
        <text x="57.5" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">Spring Boot</text>
      </g>
      <g transform="translate(225, 0)">
        <rect width="80" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #22D3EE; rgba(255,255,255,0.1)" dur="4.5s" repeatCount="indefinite" />
        </rect>
        <text x="40" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">React</text>
      </g>
      <g transform="translate(320, 0)">
        <rect width="90" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #10B981; rgba(255,255,255,0.1)" dur="5.5s" repeatCount="indefinite" />
        </rect>
        <text x="45" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">Node.js</text>
      </g>
      <g transform="translate(425, 0)">
        <rect width="115" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #7C3AED; rgba(255,255,255,0.1)" dur="6s" repeatCount="indefinite" />
        </rect>
        <text x="57.5" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">PostgreSQL</text>
      </g>
      
      <g transform="translate(0, 50)">
        <rect width="105" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #22D3EE; rgba(255,255,255,0.1)" dur="4s" repeatCount="indefinite" />
        </rect>
        <text x="52.5" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">JavaScript</text>
      </g>
      <g transform="translate(120, 50)">
        <rect width="85" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #10B981; rgba(255,255,255,0.1)" dur="5s" repeatCount="indefinite" />
        </rect>
        <text x="42.5" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">Python</text>
      </g>
      <g transform="translate(220, 50)">
        <rect width="60" height="36" rx="18" fill="#1E293B" stroke="rgba(255,255,255,0.1)">
          <animate attributeName="stroke" values="rgba(255,255,255,0.1); #7C3AED; rgba(255,255,255,0.1)" dur="4.5s" repeatCount="indefinite" />
        </rect>
        <text x="30" y="23" font-family="sans-serif" font-size="14" fill="#F8FAFC" text-anchor="middle">C#</text>
      </g>
    </g>

    <g transform="translate(0, 480)" font-family="sans-serif" font-size="14" fill="#94A3B8">
      <g transform="translate(0, 0)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" />
        <text x="42" y="21">GitHub</text>
      </g>
      <g transform="translate(110, 0)">
        <circle cx="16" cy="16" r="16" fill="#1E293B" />
        <text x="42" y="21">LinkedIn</text>
      </g>
    </g>
  </g>
</svg>
