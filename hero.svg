<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 610" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep void -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Animated Accent Gradient: Purple -> Cyan -> Green -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED">
        <animate attributeName="stop-color" values="#7C3AED;#22D3EE;#10B981;#7C3AED" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#22D3EE">
        <animate attributeName="stop-color" values="#22D3EE;#10B981;#7C3AED;#22D3EE" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#10B981">
        <animate attributeName="stop-color" values="#10B981;#7C3AED;#22D3EE;#10B981" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Glassmorphism Effect -->
    <filter id="glass" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMorphology operator="dilate" radius="1" in="blur" result="shaded_blur" />
      <feComposite in="SourceGraphic" in2="shaded_blur" operator="over" />
    </filter>

    <!-- Glowing Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    
    <!-- Clipping portrait to terminal inner bounds -->
    <clipPath id="terminal-clip">
      <rect x="20" y="50" width="360" height="400" rx="8" />
    </clipPath>

    <!-- Social Icons Path Data -->
    <path id="github-path" d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.43.372.823 1.102.823 2.222 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"/>
    <path id="linkedin-path" d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z"/>
  </defs>

  <!-- Background Layer -->
  <rect width="1180" height="610" rx="24" fill="url(#bg)" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

  <!-- Ambient background shapes -->
  <g opacity="0.2">
    <circle cx="150" cy="500" r="60" fill="#7C3AED" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 80,-120; 0,0" dur="20s" repeatCount="indefinite" />
    </circle>
    <circle cx="1000" cy="150" r="90" fill="#22D3EE" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; -100,70; 0,0" dur="25s" repeatCount="indefinite" />
    </circle>
    <circle cx="700" cy="350" r="110" fill="#10B981" filter="url(#glow)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 50,60; 0,0" dur="22s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Left Side: Terminal Block -->
  <g transform="translate(50, 40)">
    <!-- Terminal Window -->
    <rect width="400" height="530" rx="16" fill="#0D1117" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" filter="url(#glass)" />
    
    <!-- Top Bar -->
    <rect width="400" height="35" rx="16" fill="rgba(255,255,255,0.03)" />
    <!-- Top Bar Clip for bottom rounding logic -->
    <rect y="16" width="400" height="19" fill="rgba(255,255,255,0.03)" />

    <!-- Window Dots -->
    <circle cx="25" cy="18" r="6" fill="#EF4444" opacity="0.9" />
    <circle cx="45" cy="18" r="6" fill="#F59E0B" opacity="0.9" />
    <circle cx="65" cy="18" r="6" fill="#10B981" opacity="0.9" />
    <text x="215" y="22" font-family="monospace" font-size="12" fill="#8B949E" text-anchor="middle">~/berktopal/portrait</text>
    
    <!-- Animated Scanline effect on portrait area -->
    <rect x="20" y="50" width="360" height="400" rx="4" fill="rgba(0,0,0,0.2)" />
    <rect x="20" y="50" width="360" height="2" fill="rgba(34,211,238,0.15)">
      <animate attributeName="y" values="50; 450; 50" dur="3s" repeatCount="indefinite" />
    </rect>
    
    <!-- ASCII ART PORTRAIT (Layered for depth) -->
    <g clip-path="url(#terminal-clip)" opacity="0.8">
        <g transform="translate(32, 85)" font-family="monospace" font-size="9" font-weight="bold" letter-spacing="1.6">
          <!-- Background layers for glitched depth -->
          <text y="0" fill="#7C3AED" opacity="0.3" x="1">                                        </text>
          
          <!-- Main ASCII layer with dynamic coloring and glow -->
          <g fill="url(#accent)" filter="url(#glow)">
            <text y="0" xml:space="preserve">                                        </text>
            <text y="11" xml:space="preserve">               ::,::+*+:**:             </text>
            <text y="22" xml:space="preserve">            :&amp;M@@@@MMM@@@#M8,.          </text>
            <text y="33" xml:space="preserve">        :+?&amp;@@@@@@@@@@@@@@@@@@#*        </text>
            <text y="44" xml:space="preserve">     .?8M@@@@@@@@@@@@@@@@@@@@@@@8?.     </text>
            <text y="55" xml:space="preserve">     *M@@@@@@@@@@@@@@@@@@@@@@@@@@@&amp;?    </text>
            <text y="66" xml:space="preserve">  .%#M@@@@@@@@@@@@@@@@@@@@@@@@@@@@@M?.  </text>
            <text y="77" xml:space="preserve">  +@@@@@@@@@@@MM@@@@@@@@@@@@@@@@@@@@@M* </text>
            <text y="88" xml:space="preserve">.*@M@@@@@@@@M#MM###MM##MM@@M@@@@@@@@@@@:</text>
            <text y="99" xml:space="preserve">:@@@@@@@@@M8#8&amp;?+?8M##88##MMMM@@@@@@@@@?</text>
            <text y="110" xml:space="preserve">,8@@@@@@@@&amp;*%%*::*88&amp;%??*?&amp;##8M@@@@@@@@%</text>
            <text y="121" xml:space="preserve">,M@@@@@@M%+,,,...,,+*:,,.,:?%&amp;&amp;@@@@@@@@?</text>
            <text y="132" xml:space="preserve">,@@@@@@@&amp;*?%?++:,,.  ..,,:+?%??#@@@@@@@8</text>
            <text y="143" xml:space="preserve"> ,@@@@@@?&amp;8888###8+..:&amp;#M##88#&amp;%@@@@@@8 </text>
            <text y="154" xml:space="preserve">  *M#@@M+**???&amp;%?%*,.*&amp;&amp;%&amp;%%???*&amp;@@@@#+ </text>
            <text y="165" xml:space="preserve">   +%&amp;M8:+?8&amp;%#?*?*,,*??*#&amp;&amp;#%*+?M&amp;#?   </text>
            <text y="176" xml:space="preserve">    :??%:::+*++**++,,+***++**+++*%+8,   </text>
            <text y="187" xml:space="preserve">     :**+:,..,,,,:+,.++:,:,,,,:++?+:    </text>
            <text y="198" xml:space="preserve">     .+:+:,.....,++. ,*+,,,..,:+++*     </text>
            <text y="209" xml:space="preserve">      :*+:,,...,:*&amp;+:?%+:,,.,::++:,     </text>
            <text y="220" xml:space="preserve">       ..+:,,..,:*%*?%?:,,,,::+:        </text>
            <text y="231" xml:space="preserve">         :+:::+%&amp;8&amp;+*88&amp;%*:::+*.        </text>
            <text y="242" xml:space="preserve">          ++++&amp;8&amp;%?**?%&amp;&amp;&amp;+++*:         </text>
            <text y="253" xml:space="preserve">          :*++*++*?%%?*++*****,         </text>
          </g>
          
          <!-- Flickering effect -->
          <animate attributeName="opacity" values="0.7; 1; 0.9; 1; 0.6; 1; 0.7" dur="4s" repeatCount="indefinite" />
        </g>
    </g>
    
    <!-- Separator line -->
    <rect x="20" y="465" width="360" height="1" fill="rgba(255,255,255,0.05)" />

    <!-- Console Output -->
    <rect x="30" y="485" width="8" height="16" fill="#22D3EE" opacity="0.8">
      <animate attributeName="opacity" values="1; 0; 1" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="50" y="498" font-family="monospace" font-size="14" fill="#C9D1D9">> root.build_status = 'Ready';</text>
  </g>

  <!-- Right Side: Info Block -->
  <g transform="translate(500, 40)">
    <!-- Header with Name -->
    <text x="0" y="45" font-family="sans-serif" font-weight="bold" font-size="48" fill="#F8FAFC">Hi 👋 I'm Berk Topal</text>
    
    <!-- Animated Subtitle -->
    <g transform="translate(2, 95)" font-family="monospace" font-size="26" font-weight="bold" fill="url(#accent)" filter="url(#glow)">
      <text x="0" y="0" opacity="0">Software Engineer
        <animate attributeName="opacity" values="0; 1; 1; 0; 0" keyTimes="0; 0.05; 0.33; 0.38; 1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="0" y="0" opacity="0">Full-Stack Developer
        <animate attributeName="opacity" values="0; 0; 1; 1; 0" keyTimes="0; 0.33; 0.38; 0.66; 1" dur="9s" repeatCount="indefinite" />
      </text>
      <text x="0" y="0" opacity="0">New Graduate
        <animate attributeName="opacity" values="0; 0; 0; 1; 1" keyTimes="0; 0.66; 0.71; 0.95; 1" dur="9s" repeatCount="indefinite" />
      </text>
    </g>

    <!-- Bio Description -->
    <g transform="translate(0, 145)" font-family="sans-serif" font-size="16" fill="#C9D1D9">
        <text x="0" y="0">Passionate about building scalable backend architectures and</text>
        <text x="0" y="24">seamless full-stack experiences. Constantly learning.</text>
    </g>

    <!-- Details Grid -->
    <g transform="translate(0, 215)" font-family="sans-serif" font-size="16">
      <g transform="translate(0, 0)">
        <text fill="#8B949E" font-weight="600">Location</text>
        <text x="130" fill="#F8FAFC">Denizli, Türkiye</text>
      </g>
      
      <g transform="translate(0, 32)">
        <text fill="#8B949E" font-weight="600">Education</text>
        <text x="130" fill="#F8FAFC">Bahçeşehir University (Software Engineering)</text>
      </g>
      
      <g transform="translate(0, 64)">
        <text fill="#8B949E" font-weight="600">Current Focus</text>
        <text x="130" fill="#F8FAFC">Backend Architecture &amp; Financial Tech</text>
      </g>
      
      <g transform="translate(0, 96)">
        <text fill="#8B949E" font-weight="600">Projects</text>
        <text x="130" fill="url(#accent)" font-weight="bold">SyllabusAI, Berq Bank</text>
      </g>
    </g>

    <!-- Tech Stack Section -->
    <g transform="translate(0, 360)">
      <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="22" fill="#F8FAFC">Main Tech Stack</text>
      
      <!-- Staggered animation for stack items -->
      <g transform="translate(0, 20)">
          <!-- Row 1 -->
          <g transform="translate(0, 10)">
            <rect width="70" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="35" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">Java</text>
          </g>
          <g transform="translate(80, 10)">
            <rect width="105" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="52.5" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">Spring Boot</text>
          </g>
          <g transform="translate(195, 10)">
            <rect width="75" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="37.5" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">React</text>
          </g>
          <g transform="translate(280, 10)">
            <rect width="80" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="40" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">Node.js</text>
          </g>
          <g transform="translate(370, 10)">
            <rect width="100" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="50" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">PostgreSQL</text>
          </g>

          <!-- Row 2 -->
          <g transform="translate(0, 52)">
            <rect width="95" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="47.5" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">JavaScript</text>
          </g>
          <g transform="translate(105, 52)">
            <rect width="80" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="40" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">Python</text>
          </g>
          <g transform="translate(195, 52)">
            <rect width="50" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="25" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">C#</text>
          </g>
          <g transform="translate(255, 52)">
            <rect width="80" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="40" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">Tailwind</text>
          </g>
          <g transform="translate(345, 52)">
            <rect width="55" height="32" rx="16" fill="#1E293B" stroke="rgba(255,255,255,0.08)" />
            <text x="27.5" y="21" font-family="sans-serif" font-size="13" fill="#C9D1D9" text-anchor="middle">Docker</text>
          </g>
      </g>
    </g>

    <!-- Social Links Section -->
    <g transform="translate(0, 510)">
        <text x="0" y="0" font-family="sans-serif" font-weight="bold" font-size="18" fill="#8B949E">Connect:</text>
        
        <!-- GitHub Button -->
        <g transform="translate(90, -16)">
          <rect width="110" height="32" rx="6" fill="#21262d" stroke="rgba(255,255,255,0.1)" />
          <use href="#github-path" transform="translate(10, 8) scale(0.65)" fill="#F8FAFC" />
          <text x="40" y="21" font-family="sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">GitHub</text>
        </g>
        
        <!-- LinkedIn Button -->
        <g transform="translate(210, -16)">
          <rect width="115" height="32" rx="6" fill="#21262d" stroke="rgba(255,255,255,0.1)" />
          <use href="#linkedin-path" transform="translate(10, 8) scale(0.65)" fill="#F8FAFC" />
          <text x="40" y="21" font-family="sans-serif" font-size="14" font-weight="600" fill="#F8FAFC">LinkedIn</text>
        </g>
    </g>

  </g>
</svg>
