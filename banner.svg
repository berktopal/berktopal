        <text x="0" y="418" text-anchor="middle" xml:space="preserve">@&amp;&amp;&amp;@@&amp;@@@&amp;&amp;&amp;&amp;@@&amp;?+=--------==------==+#&amp;@@&amp;@@@@@@@@&amp;&amp;@@</text>
        <text x="0" y="429" text-anchor="middle" xml:space="preserve">&amp;&amp;&amp;@@&amp;&amp;&amp;&amp;@@&amp;&amp;&amp;&amp;&amp;@@@&amp;%?*+=-------==+?%&amp;@@@&amp;&amp;&amp;@@&amp;&amp;&amp;&amp;@@&amp;&amp;@@</text>
        <text x="0" y="440" text-anchor="middle" xml:space="preserve">&amp;&amp;&amp;@@&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;@@@@@&amp;&amp;&amp;%%%&amp;&amp;&amp;&amp;@@@@@&amp;&amp;&amp;@&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;@@</text>
        <text x="0" y="451" text-anchor="middle" xml:space="preserve">&amp;&amp;@@@&amp;@&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;@&amp;@@@@@@@@@@@@@@&amp;&amp;&amp;@@@@&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;&amp;@</text>
        <animate attributeName="opacity" values="0.7; 1; 0.7" dur="3s" repeatCount="indefinite" />
