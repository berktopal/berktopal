    </g>

    <!-- Console Output -->
    <rect x="35" y="480" width="10" height="15" fill="#22D3EE">
      <animate attributeName="opacity" values="1; 0; 1" dur="1s" repeatCount="indefinite" />
    </rect>
    <text x="55" y="492" font-family="monospace" font-size="14" fill="#94A3B8">&gt; System.out.println("Ready to build.");</text>
